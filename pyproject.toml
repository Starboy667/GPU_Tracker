[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricewatch"
version = "0.5.0"
description = "Self-hosted price and stock watcher for French retailers, with a web UI and multi-channel alerts"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "curl_cffi>=0.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "apprise>=1.9",
    "tzdata>=2024.1",
    "regex>=2024.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "httpx>=0.27",
]

[project.scripts]
pricewatch = "pricewatch.cli:main"

[tool.setuptools.packages.find]
include = ["pricewatch*"]

[tool.setuptools.package-data]
pricewatch = ["web/templates/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pricewatch"]
omit = ["pricewatch/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
